name: Build platform previews

on:
  push:
    paths:
      - 'packaging/**'
      - '.github/workflows/build-platform-previews.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ubuntu:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Unit tests
        run: python3 -m unittest discover -s packaging/tests -v
      - name: Checkout pinned bridge
        uses: actions/checkout@v4
        with:
          repository: cashtsai/hermes-studio-bridge
          ref: 54e089e653766dd847e23ff3f7b6ff4e79290f3f
          ssh-key: ${{ secrets.BRIDGE_DEPLOY_KEY }}
          path: bridge-source
      - name: Sanitize and build packages
        env:
          SANITIZE_TABLE_B64: ${{ secrets.POCKET_SANITIZE_TABLE_B64 }}
        run: |
          set -euo pipefail
          test -n "$SANITIZE_TABLE_B64"
          umask 077
          printf '%s' "$SANITIZE_TABLE_B64" | base64 -d > "$RUNNER_TEMP/pocket-sanitize.json"
          POCKET_SANITIZE_TABLE="$RUNNER_TEMP/pocket-sanitize.json" python3 packaging/build_platforms.py --bridge-source bridge-source
      - name: Real systemd user-service smoke test
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y ./dist/*.deb dbus-user-session
          sudo useradd --create-home pockettest
          sudo loginctl enable-linger pockettest
          uid=$(id -u pockettest)
          for i in $(seq 1 20); do
            test -S "/run/user/$uid/bus" && break
            sleep 1
          done
          sudo -u pockettest env HOME=/home/pockettest USER=pockettest POCKET_ISOLATED_TEST=1 XDG_RUNTIME_DIR="/run/user/$uid" DBUS_SESSION_BUS_ADDRESS="unix:path=/run/user/$uid/bus" python3 "$GITHUB_WORKSPACE/packaging/tests/smoke_linux.py" --systemd
      - uses: actions/upload-artifact@v4
        with:
          name: pocket-connect-platform-previews
          path: dist/*
          if-no-files-found: error
          retention-days: 14
      - name: Remove ephemeral sanitizer table
        if: always()
        run: rm -f "$RUNNER_TEMP/pocket-sanitize.json"
  windows:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Windows PowerShell 5.1 checks
        shell: powershell
        run: ./packaging/tests/test_windows.ps1
      - name: PowerShell 7 checks
        shell: pwsh
        run: ./packaging/tests/test_windows.ps1
