name: Release

# A version tag is the only release trigger. The job produces an arm64,
# Developer ID-signed, notarized and stapled DMG.
on:
  push:
    tags:
      # Info.plist currently uses the two-component version "0.2". The
      # verification step below still rejects any tag that is not exactly
      # "v${CFBundleShortVersionString}".
      - "v*"

permissions:
  contents: write

concurrency:
  group: pocket-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-dmg:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Verify tag matches app version
        working-directory: mac-app
        run: |
          APP_VERSION=$(/usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" packaging/Info.plist)
          test "v${APP_VERSION}" = "${GITHUB_REF_NAME}" || {
            echo "Tag ${GITHUB_REF_NAME} does not match Info.plist version ${APP_VERSION}" >&2
            exit 1
          }

      - name: Run Swift tests
        working-directory: mac-app
        run: swift test

      - name: Install bundled tunnel helper
        run: brew install cloudflared

      - name: Build, sign and notarize DMG
        working-directory: mac-app
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          DEVELOPER_ID_PROFILE_BASE64: ${{ secrets.DEVELOPER_ID_PROFILE_BASE64 }}
          APPLE_NOTARY_KEY_P8_BASE64: ${{ secrets.APPLE_NOTARY_KEY_P8_BASE64 }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: |
          set -euo pipefail
          : "${MACOS_CERTIFICATE_P12_BASE64:?missing MACOS_CERTIFICATE_P12_BASE64}"
          : "${MACOS_CERTIFICATE_PASSWORD:?missing MACOS_CERTIFICATE_PASSWORD}"
          : "${DEVELOPER_ID_PROFILE_BASE64:?missing DEVELOPER_ID_PROFILE_BASE64}"
          : "${APPLE_NOTARY_KEY_P8_BASE64:?missing APPLE_NOTARY_KEY_P8_BASE64}"
          : "${APPLE_NOTARY_KEY_ID:?missing APPLE_NOTARY_KEY_ID}"
          : "${APPLE_NOTARY_ISSUER_ID:?missing APPLE_NOTARY_ISSUER_ID}"

          CERTIFICATE_PATH="$RUNNER_TEMP/pocket-developer-id.p12"
          PROFILE_PATH="$RUNNER_TEMP/pocket-desktop-developer-id.provisionprofile"
          NOTARY_KEY_PATH="$RUNNER_TEMP/AuthKey_${APPLE_NOTARY_KEY_ID}.p8"
          KEYCHAIN_PATH="$RUNNER_TEMP/pocket-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          trap 'security delete-keychain "$KEYCHAIN_PATH" >/dev/null 2>&1 || true; rm -f "$CERTIFICATE_PATH" "$PROFILE_PATH" "$NOTARY_KEY_PATH"' EXIT

          printf '%s' "$MACOS_CERTIFICATE_P12_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
          printf '%s' "$DEVELOPER_ID_PROFILE_BASE64" | base64 --decode > "$PROFILE_PATH"
          printf '%s' "$APPLE_NOTARY_KEY_P8_BASE64" | base64 --decode > "$NOTARY_KEY_PATH"
          chmod 600 "$CERTIFICATE_PATH" "$PROFILE_PATH" "$NOTARY_KEY_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" \
            -k "$KEYCHAIN_PATH" \
            -P "$MACOS_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"

          NOTARIZE=1 \
          SIGN_IDENTITY="Developer ID Application" \
          DESKTOP_PROFILE="$PROFILE_PATH" \
          TEAM_ID="4F8B93R3SH" \
          ASC_KEY_ID="$APPLE_NOTARY_KEY_ID" \
          ASC_ISSUER_ID="$APPLE_NOTARY_ISSUER_ID" \
          ASC_KEY_PATH="$NOTARY_KEY_PATH" \
          ./packaging/build_dmg.sh

      - name: Verify public artifact
        working-directory: mac-app
        run: |
          set -euo pipefail
          codesign --verify --deep --strict --verbose=2 build/Pocket.app
          spctl --assess --type execute --verbose=2 build/Pocket.app
          DMG=$(find build/dist -maxdepth 1 -name 'Pocket-*.dmg' -print -quit)
          test -n "$DMG"
          xcrun stapler validate "$DMG"
          shasum -a 256 "$DMG" > "${DMG}.sha256"

      - name: Locate artifacts
        id: artifacts
        working-directory: mac-app
        run: |
          DMG=$(find build/dist -maxdepth 1 -name 'Pocket-*.dmg' -print -quit)
          test -n "$DMG"
          echo "dmg=mac-app/$DMG" >> "$GITHUB_OUTPUT"
          echo "checksum=mac-app/${DMG}.sha256" >> "$GITHUB_OUTPUT"

      # 2026-10-05 改成 CI 永不碰正式 release 的資產。
      #
      # 事故 ×2:v0.3、v0.4 都是「本機 NOTARIZE=1 BUNDLE_BRIDGE=1 建的正貨
      # vs CI 搶跑發的空包」賽跑 —— CI 抓不到私有 bridge repo,它建的 DMG
      # **沒有內建 bridge**,乾淨 Mac 裝完就是死路;v0.3 一度把空包掛上
      # releases/latest,v0.4 靠手動取消 run 才守住。正式發行流程固定為:
      # 本機建+公證 → `gh release create` 連資產一起上。CI 從此只當建置
      # 煙霧測試(swift test + DMG 能不能組起來),產物掛 workflow artifact
      # 供查驗,不碰 release。
      - name: Upload build artifact (smoke only — CI never touches release assets)
        uses: actions/upload-artifact@v4
        with:
          name: pocket-dmg-smoke-${{ github.ref_name }}
          path: |
            ${{ steps.artifacts.outputs.dmg }}
            ${{ steps.artifacts.outputs.checksum }}
          retention-days: 14
